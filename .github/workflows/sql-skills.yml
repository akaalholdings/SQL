name: SQL skill safety

on:
  pull_request:
    paths:
      - "skills/**"
      - ".github/workflows/sql-skills.yml"
  push:
    paths:
      - "skills/**"
      - ".github/workflows/sql-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Reject local or credential-bearing artifacts
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | grep -Ei '(^|/)(\.env($|\.)|credentials?($|\.)|secrets?($|\.)|id_(rsa|dsa|ecdsa|ed25519)($|\.)|[^/]+\.(pem|key|p12|pfx|ppk)$|\.claude/|__pycache__/|\.pytest_cache/|\.DS_Store$)' | grep -vE '(^|/)\.env\.example$' || true)
          if [[ -n "$forbidden" ]]; then
            printf '%s\n' "$forbidden"
            exit 1
          fi
      - name: Install verification tools
        run: python -m pip install --disable-pip-version-check pytest ruff
      - name: Run SQL skill tests
        working-directory: skills
        run: python -m pytest -q sql_optimizer/tests sql_plan_enforcer/tests sql_health_triage/tests tests
      - name: Compile runtime helpers
        working-directory: skills
        run: python -m compileall -q sql_optimizer sql_plan_enforcer sql_health_triage install_all.py check_installed_parity.py
      - name: Lint runtime helpers and tests
        run: python -m ruff check skills
