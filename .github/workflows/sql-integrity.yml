name: SQL repository CI

on:
  push:
    paths:
      # The broad trigger includes documentation, skills, MCP, workflow, script,
      # and retired-path changes, including deletions that no longer have a path.
      - "**"
  pull_request:
    branches: [main]
    paths:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    name: Documentation and repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Run integrity script tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Check Markdown links
        run: python scripts/check_markdown_links.py
      - name: Check retired paths and references
        run: python scripts/check_retired_paths.py
      - name: Scan content for secrets
        run: python scripts/scan_content_secrets.py

  skills:
    name: Skills tests and clean-install parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install skill verification tools
        run: python -m pip install --disable-pip-version-check pytest ruff
      - name: Run skill tests
        run: python -m pytest -q skills/sql_optimizer/tests skills/sql_plan_enforcer/tests skills/sql_health_triage/tests skills/tests
      - name: Compile skill runtime helpers
        run: python -m compileall -q skills/sql_optimizer skills/sql_plan_enforcer skills/sql_health_triage skills/install_all.py skills/check_installed_parity.py scripts
      - name: Run Ruff on skills and integrity scripts
        run: python -m ruff check skills scripts
      - name: Verify clean-install parity
        shell: bash
        run: |
          set -euo pipefail
          destination="$(mktemp -d)"
          trap 'rm -rf "$destination"' EXIT
          python skills/install_all.py --dest "$destination"
          python skills/check_installed_parity.py --dest "$destination"

  mcp:
    name: MCP checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          cache-suffix: ${{ matrix.python-version }}
          cache-dependency-glob: azure-sql-mcp/uv.lock
      - name: Set up Python
        working-directory: azure-sql-mcp
        run: uv python install ${{ matrix.python-version }}
      - name: Install locked MCP dependencies
        working-directory: azure-sql-mcp
        run: uv sync --dev --locked
      - name: Run Ruff
        working-directory: azure-sql-mcp
        run: uv run ruff check src tests
      - name: Run Pyright
        working-directory: azure-sql-mcp
        run: uv run pyright
      - name: Compile MCP package and tests
        working-directory: azure-sql-mcp
        run: uv run python -m compileall -q src tests
      - name: Run MCP tests
        working-directory: azure-sql-mcp
        run: uv run pytest -q
      - name: Build MCP package
        working-directory: azure-sql-mcp
        run: uv build
