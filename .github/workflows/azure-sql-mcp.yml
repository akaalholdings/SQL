name: Azure SQL MCP CI

on:
  push:
    paths:
      - "azure-sql-mcp/**"
      - ".github/workflows/azure-sql-mcp.yml"
  pull_request:
    branches: [main]
    paths:
      - "azure-sql-mcp/**"
      - ".github/workflows/azure-sql-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Reject local or credential-bearing artifacts
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | grep -Ei '(^|/)(\.env($|\.)|credentials?($|\.)|secrets?($|\.)|id_(rsa|dsa|ecdsa|ed25519)($|\.)|[^/]+\.(pem|key|p12|pfx|ppk)$|\.claude/|__pycache__/|\.pytest_cache/|\.DS_Store$)' | grep -vE '(^|/)\.env\.example$' || true)
          if [[ -n "$forbidden" ]]; then
            printf '%s\n' "$forbidden"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          cache-suffix: ${{ matrix.python-version }}
          cache-dependency-glob: azure-sql-mcp/uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        working-directory: azure-sql-mcp
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: azure-sql-mcp
        run: uv sync

      - name: Ruff
        working-directory: azure-sql-mcp
        run: uv run ruff check src tests

      - name: Pyright
        working-directory: azure-sql-mcp
        run: uv run pyright

      - name: Compile
        working-directory: azure-sql-mcp
        run: uv run python -m compileall -q src tests

      - name: Run tests
        working-directory: azure-sql-mcp
        run: uv run pytest -q

      - name: Build
        working-directory: azure-sql-mcp
        run: uv build
