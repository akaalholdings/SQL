[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "query-geneva-db"
version = "0.1.0"
description = "Read-only Geneva DB query CLI with safe SQL execution and NL2SQL table mapping."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "azure-identity>=1.16.0",
  "pyodbc>=5.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
query_geneva_db = "query_geneva_db.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
query_geneva_db = ["resources/*.sql"]
