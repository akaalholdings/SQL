[pytest]
# The skills each ship same-named modules (install.py) and test basenames
# (test_install.py, test_guides.py); importlib mode keeps one combined run
# from cross-importing between skill bundles.
addopts = --import-mode=importlib
# Limit collection to maintained skill suites. This also prevents pytest from
# treating the optimizer's test_index_ledger.py CLI as a test module.
testpaths =
    tests
    sql_health_triage/tests
    sql_optimizer/tests
    sql_plan_enforcer/tests
